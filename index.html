<script>
var TOKEN = '', D = null, R = null, TAB = 'hoy', FILTRO = '', SEGC = 'todos', SEGM = 'rec', SEGT = 'G', SEGP = 'reg', CX = null, DL = null;
function $(i){ return document.getElementById(i); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
function m(n){ var r = Math.round(Number(n) || 0); return (r < 0 ? '-$' : '$') + Math.abs(r).toLocaleString('es-MX'); }
function mm(n){ n = Number(n) || 0; return Math.abs(n) >= 1e6 ? '$' + (n / 1e6).toFixed(2) + ' M' : m(n); }
function tit(t){ return String(t || '').toLowerCase().replace(/(^|\s)(\S)/g, function(a, b, c){ return b + c.toUpperCase(); }); }
function ini(t){ return String(t || '').trim().split(/\s+/).slice(0, 2).map(function(x){ return x[0] || ''; }).join('').toUpperCase(); }
function corto(t){ var p = String(t || '').trim().split(/\s+/); return tit(p.length > 3 && !/^(DE|DEL|LA|LAS|LOS|Y)$/i.test(p[p.length - 2]) ? p.slice(0, p.length - 1).join(' ') : p.join(' ')); }   // nombre sin el 2º apellido
function primer(t){ return tit(String(t || '').trim().split(/\s+/)[0]); }
function wa(tel, txt){ var t = String(tel || '').replace(/\D/g, '').slice(-10); return t.length === 10 ? 'https://wa.me/52' + t + (txt ? '?text=' + encodeURIComponent(txt) : '') : ''; }
function guardarLocal(k, v){ try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} }
function leerLocal(k){ try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function adm(){ return !!(D && D.yo && D.yo.tipo === 'admin'); }
function hoyIso(){ var h = new Date(); return h.getFullYear() + '-' + String(h.getMonth() + 1).padStart(2, '0') + '-' + String(h.getDate()).padStart(2, '0'); }
function fIso(s){ return String(s || '').split('-').reverse().join('/'); }
function nuevoOp(){ var r = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2); return (Date.now().toString(36) + '-' + r).replace(/[^\w-]/g, '').slice(0, 60); }
function num(v){ var n = Number(String(v == null ? '' : v).replace(/[$,\s]/g, '')); return isFinite(n) ? n : 0; }
// El sistema responde en esta dirección (la misma liga del dashboard; doPost en app_movil.js)
var API_URL = 'https://script.google.com/macros/s/AKfycbz1T1J4RBhEMQ2otL8dFYOu3vijvq8yxjGmnWxAyS6JMUylYF8_TpCgxjOBENGbmkoO/exec';

    .then(function(r){ clearTimeout(tm); return r.json().catch(function(){ throw new Error('El sistema no respondió bien (código ' + r.status + '). Intenta de nuevo.'); }); })
    .then(function(j){ if (!j || !j.ok) throw new Error((j && j.error) || 'Error desconocido'); ok(j.data); })

// leer: una función del sistema. Si la sesión venció, regresa al login.
function leer(fn, args, ok, mal){ api({ accion: 'api', token: TOKEN, fn: fn, args: args || [] }, ok, function(e){ if (sesionMala(e)) return; (mal || function(x){ alert(x.message); })(e); }); }

// ---------- entrar ----------
function pantallaLogin(err){

  return L.filter(function(c){ if (!q) return true; if (nm && c.id.replace(/\D/g, '').slice(-nm.length) === nm) return true;
    if (nm.length >= 4 && (String(c.tel).indexOf(nm) >= 0 || (c.integrantes || []).some(function(i){ return String(i.tel || '').indexOf(nm) >= 0; }))) return true;
    return norm(c.nombre).indexOf(q) >= 0 || (c.integrantes || []).some(function(i){ return norm(i.nombre).indexOf(q) >= 0; }); }); }
function listaC(){
  var L = buscaCreds(activos(), FILTRO).filter(function(c){
    if (SEGC === 'venc' && !(c.vencido > 0)) return false; if (SEGC === 'grupal' && tipoK(c) !== 'G') return false; if (SEGC === 'comp' && tipoK(c) !== 'C') return false; if (SEGC === 'simple' && tipoK(c) !== 'S') return false; return true; });
  L.sort(function(a, b){ return b.vencido - a.vencido || b.id.localeCompare(a.id); });
  $('lc').innerHTML = L.length ? '<p class="mini">' + L.length + ' crédito(s) · debe ' + m(L.reduce(function(s, c){ return s + c.debe; }, 0)) + '</p>' + L.map(function(c){ return filaCred(c, c.vencido > 0 ? 'venc' : 'debe'); }).join('') : '<div class="vacio">No hay créditos con eso.</div>'; }

    h += c.integrantes.map(function(i){ var txt = i.debe > 0 ? 'Hola ' + primer(i.nombre) + ', le saluda Inversiones Conscientes. En el grupo ' + c.id + ' tiene pendiente ' + m(i.debe) + ' de su aportación semanal (' + m(i.pago) + '). ¿Nos confirma cuándo lo cubre? Concepto: PAGO PRESTAMO ' + c.id.replace(/\D/g, '').slice(-4) + '.' : '';
      return '<div class="f" style="cursor:default;"><div class="av' + (i.debe > 0 ? ' r' : '') + '">' + esc(ini(i.nombre)) + '</div><div class="tx"><div class="nm">' + esc(corto(i.nombre)) + (i.ancla ? ' <span class="chip" style="margin:0;">ancla</span>' : '') + '</div><div class="dt">aporta ' + m(i.pago) + ' por semana' + (i.monto ? ' · le tocó ' + m(i.monto) : '') + '</div></div>' +

    (ab.length > 8 ? '<tr><td colspan="4" class="mini">… ' + (ab.length - 8) + ' cuotas más (ver el reporte)</td></tr>' : '') + (ab.length ? '' : '<tr><td colspan="4" class="mini">Sin cuotas pendientes.</td></tr>') + '</table>';

  abrirPanel(h + '</div>'); }

// ---------- COBRAR: grupales / individuales compuesto / simple ----------
function vCobrar(){ var M = D.mensajes || {}, todos = SEGM === 'rec' ? (M.recordatorio || []) : (M.atrasos || []);

  if (!vCobrar._ya) { vCobrar._ya = 1; var tot = function(k){ return cuenta(M.recordatorio || [], k) + cuenta(M.atrasos || [], k); }; if (!tot(SEGT)) { var k1 = ['G','C','S'].filter(function(k){ return tot(k) > 0; })[0]; if (k1) SEGT = k1; }
    if (!cuenta(SEGM === 'rec' ? (M.recordatorio || []) : (M.atrasos || []), SEGT)) SEGM = SEGM === 'rec' ? 'atr' : 'rec'; }
  todos = SEGM === 'rec' ? (M.recordatorio || []) : (M.atrasos || []);

  var h = '<div class="w">' + cabeza('Cobrar') +
    '<div class="seg3">' + [['G','Grupales'],['C','Ind. compuesto'],['S','Ind. simple']].map(function(t){ var n = cuenta(M.recordatorio || [], t[0]) + cuenta(M.atrasos || [], t[0]); return '<button class="' + (SEGT === t[0] ? 'on' : '') + '" onclick="SEGT=\'' + t[0] + '\';vCobrar()">' + t[1] + ' ' + n + '</button>'; }).join('') + '</div>' +
    '<div class="seg"><button class="' + (SEGM === 'rec' ? 'on' : '') + '" onclick="SEGM=\'rec\';vCobrar()">Recordatorio hoy y mañana (' + cuenta(M.recordatorio || [], SEGT) + ')</button><button class="' + (SEGM === 'atr' ? 'on' : '') + '" onclick="SEGM=\'atr\';vCobrar()">Atrasos (' + cuenta(M.atrasos || [], SEGT) + ')</button></div>' +
    ((M.errorRec || M.errorAtr) ? '<div class="aviso a">No se pudieron armar algunos mensajes: ' + esc(M.errorRec || M.errorAtr) + '</div>' : '');
  // 15/11/2026: lista compacta. El mensaje se despliega con "Ver mensaje"; botones WhatsApp · Copiar · Ya pagó. Los ya enviados bajan al final.
  var env = L.filter(function(x){ return x.enviado; }).length, Lo = L.filter(function(x){ return !x.enviado; }).concat(L.filter(function(x){ return x.enviado; }));
  h += L.length ? '<div class="cbz"><span>Total ' + m(L.reduce(function(s, x){ return s + x.falta; }, 0)) + '</span><span>Enviados ' + env + ' de ' + L.length + '</span></div><div class="bar" style="margin:0 0 10px;"><i style="width:' + Math.round(env / L.length * 100) + '%"></i></div>' +
    Lo.map(function(x){ var k = todos.indexOf(x), l = wa(x.tel, x.mensaje), c = credDe(x.idCred), ky = SEGM + '|' + x.idVenc, ab = !!CB_AB[ky];
    return '<div class="cb' + (x.enviado ? ' ok' : '') + (SEGM === 'atr' ? ' at' : '') + '"><div class="cb1"><div class="tx"><div class="nm">' + (x.enviado ? '✓ ' : '') + esc(corto(x.nombre)) + '</div><div class="dt">' + esc(x.idCred) +
        (SEGM === 'atr' ? ' · <b style="color:var(--bad)">' + x.dias + ' día' + (x.dias === 1 ? '' : 's') + '</b>' + (x.detalle ? ' · ' + esc(x.detalle.split(':')[0]) : '') : ' · vence ' + esc(x.fecha.slice(0, 5))) +
        (x.enviado ? ' · <span style="color:var(--ac)">enviado ' + esc(String(x.enviado)) + '</span>' : '') + '</div></div><div class="mt">' + m(x.falta) + '</div></div>' +
      '<button class="cbv" onclick="cbVer(\'' + ky + '\')">' + (ab ? 'Ocultar mensaje ▴' : 'Ver mensaje ▾') + '</button>' + (ab ? '<div class="bur" style="margin:4px 0 8px;max-height:none;overflow:visible;white-space:pre-wrap;">' + esc(x.mensaje) + '</div>' : '') +
      '<div class="cbb">' + (l ? '<a class="w1" target="_blank" href="' + l + '" onclick="marcarEnviado(' + k + ')">💬 WhatsApp</a>' : '<span class="w0">sin teléfono</span>') +
        '<button onclick="cbCopiar(' + k + ')">📋 Copiar</button>' +
        (adm() && c && !c.porDispersar ? '<button onclick="pagoAbrir(\'' + x.idCred + '\')">💵 Ya pagó</button>' : '<button onclick="ficha(\'' + x.idCred + '\')">👁 Ver</button>') + '</div></div>'; }).join('')
    : '<div class="vacio">' + (SEGM === 'rec' ? 'No hay pagos de este tipo que venzan hoy o mañana.' : 'No hay atrasos de este tipo. 🎉') + '</div>';
  $('app').innerHTML = h + '<p class="mini">Son los mismos mensajes de "Mensajes del día". WhatsApp abre el chat con el texto listo y lo marca como enviado; Copiar es para mandarlo por otro lado.</p></div>'; }
var CB_AB = {};
function cbVer(ky){ CB_AB[ky] = !CB_AB[ky]; var y = scrollY; vCobrar(); scrollTo(0, y); }
function cbCopiar(k){ var L = SEGM === 'rec' ? D.mensajes.recordatorio : D.mensajes.atrasos, x = L[k]; if (!x) return;
  var ok = function(){ var t = $('toast'); if (t) { t.textContent = 'Mensaje copiado'; t.classList.add('on'); setTimeout(function(){ t.classList.remove('on'); }, 1600); } else alert('Mensaje copiado.'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(x.mensaje).then(ok, function(){ prompt('Copia el mensaje:', x.mensaje); }); else prompt('Copia el mensaje:', x.mensaje); }
function marcarEnviado(k){ var L = SEGM === 'rec' ? D.mensajes.recordatorio : D.mensajes.atrasos, x = L[k]; if (!x || x.enviado) return;
  x.enviado = 'ahora'; setTimeout(function(){ if (TAB === 'cobrar') { var y = scrollY; vCobrar(); scrollTo(0, y); } }, 400);
  api({ accion: 'api', token: TOKEN, fn: 'appEnviado', args: [{ idVenc: x.idVenc, idCred: x.idCred, nombre: x.nombre, tel: x.tel, falta: x.falta, modo: SEGM === 'rec' ? 'RECORDATORIO' : 'ATRASOS' }] },
    function(r){ x.enviado = r.hora; guardarLocal('ic_app_datos', JSON.stringify(D)); if (TAB === 'cobrar') vCobrar(); }, function(){ x.enviado = ''; if (TAB === 'cobrar') vCobrar(); }); }

// ---------- PAGOS: registrar / modificar o anular ----------

  $('app').innerHTML = h + '</div>'; if (PL) pintarPagosL(); else buscarPagos(); }
function listaPagoReg(){ var L = buscaCreds(activos().filter(function(c){ return c.cuotas.some(function(q){ return q.falta > 0.5; }); }), PQ);

function buscarPagos(){ $('lp').innerHTML = cargando('Buscando pagos…');

function pintarPagosL(){ var L = PL || []; if (!$('lp')) return;
  $('lp').innerHTML = (PQ ? '' : '<p class="mini">Los últimos pagos registrados. Busca para ver otros.</p>') + (L.length ? L.map(function(p, k){ return '<button class="f" onclick="corrAbrir(' + k + ')"' + (p.anulado ? ' style="opacity:.55"' : '') + '><div class="av">' + (p.esGrupal ? '👥' : '👤') + '</div><div class="tx"><div class="nm">' + esc(p.idCred) + ' · ' + esc(corto(p.nombre)) + '</div><div class="dt">' + esc(p.fecha) + ' · cuota ' + p.numPago + ' · ' + esc(p.cuenta) + ' · ' + esc(p.tipo) + '</div></div><div class="mt">' + m(p.monto) + (p.anulado ? '<small>anulado</small>' : '') + '</div></button>'; }).join('') : '<div class="vacio">No encontré pagos con eso.</div>'); }
var CP = null;
function corrAbrir(k){ var p = PL[k]; if (!p || p.anulado) { if (p) alert('Ese pago ya está anulado.'); return; }
  var acc = p.adicional ? ['ANULAR','CUENTA'] : (p.esGrupal ? ['ANULAR','FECHA','CUENTA'] : ['ANULAR','FECHA','CUENTA','MONTO','MOVER']);
  CP = { p: p, acc: acc, a: acc[0], cuotas: null, op: nuevoOp() }; corrPintar(); }
function corrPintar(){ var c = CP, p = c.p, et = { ANULAR: 'Anular', FECHA: 'Fecha', CUENTA: 'Cuenta', MONTO: 'Monto', MOVER: 'Otra cuota' };
  var h = '<div class="w"><button class="back" onclick="history.back()">← Pagos</button><div class="big">Corregir pago</div>' +
    '<div class="msg"><b>' + esc(p.idCred) + ' · ' + esc(tit(p.nombre)) + '</b><div class="mini">' + esc(p.idPago) + ' · ' + esc(p.fecha) + ' · cuota ' + p.numPago + ' · ' + esc(p.cuenta) + ' · ' + esc(p.tipo) + '</div><div class="big" style="font-size:20px;margin:4px 0 0;">' + m(p.monto) + '</div>' + (p.desglose ? '<div class="mini">Desglose: ' + esc(p.desglose) + '</div>' : '') + '</div>' +
    '<div class="seg">' + c.acc.map(function(a){ return '<button class="' + (c.a === a ? 'on' : '') + '" onclick="CP.a=\'' + a + '\';corrPintar()">' + et[a] + '</button>'; }).join('') + '</div>';
  if (c.a === 'ANULAR') h += '<div class="aviso a">El pago queda ANULADO (monto en cero) y la cuota se recalcula. No se borra: queda en la historia.</div>';
  if (c.a === 'FECHA') h += '<label class="fld">Fecha correcta<input type="date" id="cFecha" value="' + esc(p.fechaISO) + '" max="' + hoyIso() + '"></label>';
  if (c.a === 'CUENTA') h += '<label class="fld">Cuenta correcta<select id="cCuenta">' + ['BBVA','EFECTIVO','NU'].filter(function(x){ return x !== p.cuenta; }).map(function(x){ return '<option>' + x + '</option>'; }).join('') + '</select></label>';
  if (c.a === 'MONTO') h += '<label class="fld">Monto correcto<input type="number" inputmode="decimal" id="cMonto" value="' + p.monto + '"></label>';
  if (c.a === 'MOVER') { if (!c.cuotas) { h += cargando('Trayendo las cuotas…'); leer('appPagoCuotas', [p.idCred], function(L){ if (CP === c) { c.cuotas = L; corrPintar(); } }); }
    else h += '<label class="fld">Mover a la cuota<select id="cVenc">' + c.cuotas.filter(function(q){ return q.id !== p.idVenc; }).map(function(q){ return '<option value="' + esc(q.id) + '">#' + q.num + ' · ' + esc(q.fecha) + ' · falta ' + m(q.falta) + ' · ' + esc(q.estatus || '') + '</option>'; }).join('') + '</select></label>'; }
  if (p.esGrupal && c.a !== 'ANULAR') h += '<p class="mini">En grupales el monto y el cambio de cuota llevan desglose por integrante: anúlalo y regístralo de nuevo, o hazlo en la computadora.</p>';
  h += '<label class="fld">Motivo<input id="cMot" placeholder="Ej. se capturó doble, era de NU…"></label><button class="btn bp" id="cBtn" onclick="corrGuardar()">' + (c.a === 'ANULAR' ? 'Anular pago' : 'Guardar corrección') + '</button>';
  abrirPanel(h + '</div>'); }
function corrGuardar(){ var c = CP, p = c.p, x = { idPago: p.idPago, accion: c.a, motivo: $('cMot').value.trim() };

    function(e){ b.disabled = false; b.textContent = 'Reintentar'; alert(e.message); }, c.op); }

// ---------- REGISTRAR PAGO — usa el mismo pgRegistrar de "Registrar pago" ----------
var PG = null;
function pagoAbrir(id){ var c = credDe(id); if (!c) return;
  var ab = c.cuotas.filter(function(q){ return q.falta > 0.5; }); if (!ab.length) { alert(id + ' no tiene cuotas pendientes.'); return; }
  PG = { c: c, cuotas: ab, idVenc: ab[0].id, info: null, op: nuevoOp(), fecha: hoyIso(), cuenta: 'BBVA', monto: '', nota: '', ap: {}, tipo: 'cuota', apC: '' };
  pagoCargarCuota(); }
function pagoCargarCuota(){ var p = PG; p.info = null; p.error = ''; pagoPintar();
