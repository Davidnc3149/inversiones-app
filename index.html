function prCanvas(r){
  var d = r.detalle, p = d.promotor, act = d.creditos.filter(function(c){ return !c.detenido; }), W = 820, P = 28, S = 2;

  k.forEach(function(q, j){ var X = P + j * (cw + 12); rr(X, y, cw, 76, 10, '#fff', '#e1e6ee'); tx(q[0], X + 12, y + 22, 'bold 12px Arial', '#5a6577'); tx(q[1], X + 12, y + 52, 'bold 24px Arial', q[2]); if (q[3]) tx(q[3], X + 12, y + 69, '12px Arial', '#5a6577'); });
